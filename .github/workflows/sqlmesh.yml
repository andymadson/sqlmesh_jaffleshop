name: SQLMesh Bot

on:
  pull_request:
    types: [synchronize, opened]

jobs:
  sqlmesh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: List files
        run: ls -R
      - name: Install SQLMesh + Dependencies
        run: pip install -r requirements.txt
      - name: Run SQLMesh Plan
        run: sqlmesh plan